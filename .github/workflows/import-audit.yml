name: Import SAVIXARA audit branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout isolated audit source
        uses: actions/checkout@v4
        with:
          repository: rafisuryarizkika-maker/savixara
          ref: audit/deno-lease-patch-20261018
          path: source
          fetch-depth: 1

      - name: Copy audit files and remove production deployment workflow
        run: |
          rsync -a --exclude='.git/' --exclude='.github/' source/ ./
          rm -f .github/workflows/main.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("vite.config.js")
          s = p.read_text()
          old = "base: '/savixara/'"
          new = "base: '/savixara-test/'"
          if old not in s:
              raise SystemExit("Expected Vite base path was not found; refusing to continue.")
          p.write_text(s.replace(old, new))
          PY

      - name: Commit isolated audit copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: import isolated SAVIXARA audit branch"
          git push origin HEAD:main
