name: SAVIXARA Auth Audit Page Build

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/pages/AuthGateAudit.jsx"
      - "src/main.jsx"
      - "src/supabase.js"
      - "package.json"
      - "vite.config.js"
      - ".github/workflows/auth-audit-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build isolated test site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build with isolated test Supabase configuration
        env:
          VITE_SUPABASE_URL: https://bumoiebziefburtmisnn.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::TEST_SUPABASE_PUBLISHABLE_KEY secret is missing."
            exit 1
          fi
          npm run build
