name: Deploy SAVIXARA Test Site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - 'scripts/verify-supabase-test-target.mjs'
      - '.github/workflows/deploy-test-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: https://bumoiebziefburtmisnn.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_2jHWucsQvNqEiLLk9Re3aA_n0JFVr42
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify isolated test Supabase target
        run: node scripts/verify-supabase-test-target.mjs

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Verify built entrypoint
        run: test -s dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy test website
        id: deployment
        uses: actions/deploy-pages@v4
